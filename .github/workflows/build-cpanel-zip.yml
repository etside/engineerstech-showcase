name: Build — Production Deployment ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (emergency deploy)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for release notes

      # ── 2. Setup Node 22 ──────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install dependencies (exact lock file) ─────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 4. TypeScript type-check ──────────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true   # warn but don't block deploy

      # ── 5. Lint ───────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true   # warn but don't block deploy

      # ── 6. Unit tests ─────────────────────────────────────────────────────────
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: npm test -- --reporter=verbose
        continue-on-error: true   # warn on test failures; don't block deploy

      # ── 7. Build React frontend ───────────────────────────────────────────────
      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_SITE_URL: https://biz.h-tv.online
          NODE_ENV: production
        run: npm run build

      # ── 8. Verify dist output ─────────────────────────────────────────────────
      - name: Verify build output
        run: |
          echo "── dist contents (top 2 levels) ──"
          find dist -maxdepth 2 | sort
          [ -f dist/index.html ] || (echo "ERROR: dist/index.html missing" && exit 1)
          echo "index.html ✓"
          ASSET_COUNT=$(find dist/assets -type f | wc -l)
          echo "Assets: $ASSET_COUNT files"
          [ "$ASSET_COUNT" -gt 0 ] || (echo "ERROR: no assets built" && exit 1)

      # ── 9. Inject production config.env from GitHub Secrets ───────────────────
      # Required secrets (Settings → Secrets → Actions):
      #   DB_HOST, DB_NAME, DB_USER, DB_PASS, JWT_SECRET
      # Optional secrets:
      #   SITE_URL (defaults to https://biz.h-tv.online)
      #   SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM
      - name: Write production config.env
        env:
          DB_HOST:    ${{ secrets.DB_HOST }}
          DB_NAME:    ${{ secrets.DB_NAME }}
          DB_USER:    ${{ secrets.DB_USER }}
          DB_PASS:    ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_URL:   ${{ secrets.SITE_URL }}
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_FROM:  ${{ secrets.SMTP_FROM }}
        run: |
          if [ -n "$DB_HOST" ]; then
            cat > api/config.env <<EOF
          DB_HOST=${DB_HOST}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          JWT_SECRET=${JWT_SECRET}
          SITE_URL=${SITE_URL:-https://biz.h-tv.online}
          SMTP_HOST=${SMTP_HOST:-localhost}
          SMTP_PORT=587
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-no-reply@biz.h-tv.online}
          EOF
            echo "✓ config.env written from GitHub Secrets"
          else
            echo "⚠ DB_HOST secret not set — using committed config.env as-is"
          fi

      # ── 10. Assemble deployment package ───────────────────────────────────────
      - name: Assemble deployment package
        run: |
          set -e
          mkdir -p deploy/api
          mkdir -p deploy/uploads

          # React SPA build
          cp -r dist/. deploy/

          # SPA + API routing + .well-known OAuth + security headers
          cp .htaccess deploy/.htaccess

          # Full PHP API backend (includes config.env with injected secrets)
          cp -r api/. deploy/api/

          # Public static files
          for f in robots.txt sitemap.xml llms.txt favicon.ico; do
            [ -f "public/$f" ] && cp "public/$f" deploy/ && echo "Copied $f" || true
          done

          # Uploads placeholder
          cat > deploy/uploads/README.txt <<'EOF'
          Writable upload directory for admin media library.
          Set chmod 755 via cPanel File Manager after deployment.
          EOF

          echo "── Deploy package structure ──"
          find deploy -maxdepth 3 | sort

      # ── 11. Verify config.env (keys only, no values) ──────────────────────────
      - name: Verify config.env (no secret values printed)
        run: |
          CONFIG="deploy/api/config.env"
          if [ -f "$CONFIG" ]; then
            echo "config.env present ✓"
            echo "Keys found:"
            grep -oE '^[A-Z_]+' "$CONFIG" | sort | tr '\n' ' '
            echo ""
            # Fail if JWT_SECRET is still the placeholder
            if grep -q "change-in-production\|engineerstech-showcase-secret" "$CONFIG"; then
              echo "ERROR: JWT_SECRET is still the default placeholder — set JWT_SECRET secret in GitHub" >&2
              exit 1
            fi
            echo "JWT_SECRET is non-default ✓"
          else
            echo "WARNING: api/config.env not found — deployment needs manual DB config"
          fi

      # ── 12. Create timestamped ZIP ────────────────────────────────────────────
      - name: Create deployment ZIP
        id: zip
        run: |
          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="engineerstech-cpanel-${BUILD_DATE}.zip"
          cd deploy
          zip -r ../"$ZIP_NAME" . \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX*" \
            --exclude "*.map"     \
            --exclude ".git*"
          cd ..
          cp "$ZIP_NAME" engineerstech-cpanel-latest.zip
          ZIP_SIZE=$(du -sh "$ZIP_NAME" | cut -f1)
          echo "zip_name=$ZIP_NAME"     >> "$GITHUB_OUTPUT"
          echo "zip_size=$ZIP_SIZE"     >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "ZIP: $ZIP_NAME ($ZIP_SIZE)"

      # ── 13. Upload artifact (30-day retention) ────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineerstech-cpanel-${{ steps.zip.outputs.build_date }}
          path: engineerstech-cpanel-latest.zip
          retention-days: 30
          if-no-files-found: error

      # ── 14. Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deploy #${{ github.run_number }} — ${{ steps.zip.outputs.build_date }}"
          body: |
            ## engineersTech — cPanel Deployment Package

            | Field | Value |
            |---|---|
            | Build | #${{ github.run_number }} |
            | Commit | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | Branch | `${{ github.ref_name }}` |
            | ZIP size | `${{ steps.zip.outputs.zip_size }}` |
            | Built at | `${{ steps.zip.outputs.build_date }} UTC` |

            ---

            ### How to deploy to biz.h-tv.online

            1. **Download** `engineerstech-cpanel-latest.zip` from Assets below
            2. **cPanel → File Manager** → navigate to webroot (`public_html/` or subdomain folder)
            3. **Upload** the ZIP → **Extract** in place
            4. **Verify** `api/config.env` has correct DB credentials
            5. **cPanel → phpMyAdmin** → select database → **Import** `api/schema.sql` *(first deploy only)*
            6. Set `uploads/` to **chmod 755** in File Manager
            7. Visit **https://biz.h-tv.online** ✅

            ### MCP / OAuth Endpoints
            | Endpoint | URL |
            |---|---|
            | MCP Server | https://biz.h-tv.online/api/mcp-server |
            | OAuth Discovery (AS) | https://biz.h-tv.online/.well-known/oauth-authorization-server |
            | OAuth Discovery (RS) | https://biz.h-tv.online/.well-known/oauth-protected-resource |
            | Dynamic Registration | https://biz.h-tv.online/api/oauth/register |
            | JWKS | https://biz.h-tv.online/api/oauth/jwks |

            ### ChatGPT MCP — One-time connection
            1. ChatGPT → Settings → Connected Apps → Add
            2. Enter MCP URL: `https://biz.h-tv.online/api/mcp-server`
            3. ChatGPT auto-discovers OAuth via `.well-known`, auto-registers a client
            4. Authorize once → refresh tokens keep connection alive (30-day rotation)

            ### Post-deploy checklist
            - [ ] Site loads at root URL
            - [ ] `/api/mcp-server` returns server info (no auth = 401 with WWW-Authenticate)
            - [ ] `/.well-known/oauth-authorization-server` returns JSON with `registration_endpoint`
            - [ ] `/admin` login works
            - [ ] Go to `/admin/mcp` → rotate the MCP bearer token

            > ⚠️ Credentials are injected from GitHub Secrets at build time — not stored in git.
          files: |
            engineerstech-cpanel-latest.zip
          draft: false
          prerelease: false
          make_latest: true
