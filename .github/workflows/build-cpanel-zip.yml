name: Build cPanel Deployment ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-zip:
    name: Build React + Assemble ZIP
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node (needed for vite/swc native binaries on x64) ───────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies via npm (reliable on GitHub Actions) ──────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 4. Build React app ────────────────────────────────────────────────────
      - name: Build React frontend
        env:
          VITE_API_URL: /api
        run: npx vite build

      # ── 5. Assemble deployment folder ────────────────────────────────────────
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/api
          mkdir -p deploy/uploads

          # React build output
          cp -r dist/. deploy/

          # Root .htaccess (SPA + API routing + HTTPS + security headers)
          cp .htaccess deploy/.htaccess

          # Full PHP API backend
          cp -r api/. deploy/api/

          # Public assets (may already be in dist, copy anyway)
          [ -f public/robots.txt  ] && cp public/robots.txt  deploy/ || true
          [ -f public/sitemap.xml ] && cp public/sitemap.xml deploy/ || true
          [ -f public/llms.txt    ] && cp public/llms.txt    deploy/ || true
          [ -f public/favicon.ico ] && cp public/favicon.ico deploy/ || true

          # Uploads placeholder (chmod 755 after upload to cPanel)
          echo "Writable upload directory. Set chmod 755 in cPanel." \
            > deploy/uploads/README.txt

          echo "── Deploy package contents ──────────────────────────────"
          find deploy -maxdepth 3 | sort

      # ── 6. Verify credentials are baked in ────────────────────────────────────
      - name: Verify production config.env
        run: |
          echo "=== api/config.env ==="
          grep -E "^DB_|^JWT_|^SITE_" deploy/api/config.env
          echo "Config OK ✓"

      # ── 7. Create ZIP ─────────────────────────────────────────────────────────
      - name: Create deployment ZIP
        run: |
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          cd deploy
          zip -r ../engineerstech-cpanel-${BUILD_DATE}.zip . \
            --exclude "*.DS_Store" --exclude "__MACOSX*"
          cd ..
          # Also copy as fixed-name for easy reference
          cp engineerstech-cpanel-${BUILD_DATE}.zip engineerstech-cpanel-latest.zip
          echo "ZIP_NAME=engineerstech-cpanel-${BUILD_DATE}.zip" >> $GITHUB_ENV
          ls -lh *.zip

      # ── 8. Upload as Actions artifact (30-day retention, always available) ────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineerstech-cpanel-latest
          path: engineerstech-cpanel-latest.zip
          retention-days: 30

      # ── 9. Create GitHub Release with ZIP attached ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "cPanel Deploy #${{ github.run_number }}"
          body: |
            ## engineersTech — cPanel Deployment Package

            | Field | Value |
            |---|---|
            | Build | #${{ github.run_number }} |
            | Commit | `${{ github.sha }}` |
            | Branch | `${{ github.ref_name }}` |

            ---

            ### Deploy to biz.h-tv.online

            1. **Download** `engineerstech-cpanel-latest.zip` below
            2. **cPanel → File Manager** → navigate to the root of `biz.h-tv.online` (usually `public_html/` or a subdomain folder)
            3. **Upload** the zip → click **Extract**
            4. **cPanel → phpMyAdmin** → select database `samarain_engineerstech` → Import → upload `api/schema.sql`
            5. Visit **https://biz.h-tv.online** ✅

            ### Admin login
            | | |
            |---|---|
            | URL | https://biz.h-tv.online/auth |
            | Email | tjms.kp@gmail.com |
            | Password | admin#1234 |
            | Admin CMS | https://biz.h-tv.online/admin |
            | MCP Server | https://biz.h-tv.online/api/mcp-server |

            ### Post-deploy
            - Set `uploads/` to **chmod 755** in cPanel File Manager
            - Go to `/admin/mcp` → rotate the MCP bearer token
          files: |
            engineerstech-cpanel-latest.zip
          draft: false
          prerelease: false
